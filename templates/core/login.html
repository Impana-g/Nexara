<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nexara Platform</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Welcome Back</h1>
                <p>Log in to Nexara Platform</p>
            </div>

            <form id="loginForm" class="auth-form" onsubmit="handleLogin(event)">
                {% csrf_token %}

                <!-- Email -->
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input 
                        type="email" 
                        id="loginEmail" 
                        name="username" 
                        placeholder="you@example.com" 
                        required
                    >
                    <span class="error-message" id="loginEmailError"></span>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input 
                        type="password" 
                        id="loginPassword" 
                        name="password" 
                        placeholder="Enter your password" 
                        required
                    >
                    <span class="error-message" id="loginPasswordError"></span>
                </div>

                <!-- Success/Error Messages -->
                <div id="loginSuccessMessage" class="success-message" style="display: none;"></div>
                <div id="loginErrorMessage" class="error-message-box" style="display: none;"></div>

                <!-- Loading State -->
                <button type="submit" class="auth-button" id="loginSubmitBtn">
                    <span id="loginButtonText">Log In</span>
                    <span id="loginLoadingSpinner" style="display: none;"></span>
                </button>
            </form>

            <!-- Registration Link -->
            <div class="auth-footer">
                <p>Don't have an account? <a href="{% url 'auth-register-form' %}">Sign up here</a></p>
            </div>
        </div>

        <!-- Security Info -->
        <div class="auth-info">
            <h3>🔐 Protected Login</h3>
            <ul>
                <li>✓ Token-based authentication</li>
                <li>✓ Secure session management</li>
                <li>✓ CSRF protection on all forms</li>
                <li>✓ Rate limiting on failed attempts</li>
            </ul>
        </div>
    </div>

    {% load static %}
    <script src="{% static 'js/auth.js' %}"></script>
</body>
</html>
